

[[redirects]]
  from = "/.netlify/callback"
  to = "/index.html"
  status = 200
  force = true
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/custom-control.js"
  [headers.values]
    Access-Control-Allow-Origin = "https://create.netlify.com"
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-store"
    Vary = "Origin"
